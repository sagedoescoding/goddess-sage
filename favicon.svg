<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1a4f3c"/>
      <stop offset="100%" stop-color="#0a1f14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep green rounded tile -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Soft pink halo -->
  <circle cx="50" cy="50" r="42" fill="url(#glow)" opacity="0.4"/>

  <!-- Four-point sparkle -->
  <path
    d="M50 12
       C52.5 36 64 47.5 88 50
       C64 52.5 52.5 64 50 88
       C47.5 64 36 52.5 12 50
       C36 47.5 47.5 36 50 12 Z"
    fill="#f9a8d4"/>

  <!-- Bright core -->
  <circle cx="50" cy="50" r="3.5" fill="#fdf8f5" opacity="0.9"/>
</svg>